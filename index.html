<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff3dc"><meta name="apple-mobile-web-app-capable" content="yes"><title>わすれもの チェック</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#344054;background:#fff9ee}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 16px 70px}header{background:#ffe8ac;border-radius:26px;padding:22px;text-align:center}h1{font-size:clamp(25px,5vw,38px);margin:0}p{margin:7px 0}.muted{color:#667085}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}.days button{border:0;background:#fff;border-radius:16px;padding:15px 0;font-size:20px;font-weight:700;color:#526074}.days button.active{background:#8dd7c0;color:#173c33}.progress{height:13px;border-radius:20px;background:#e9e9e9;overflow:hidden}.progress>div{height:100%;background:#65c7a6;transition:width .2s}.summary{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.item{border:3px solid #e5e9ee;border-radius:22px;background:#fff;min-height:156px;padding:16px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#344054;cursor:pointer}.item.done{background:#e1f8ec;border-color:#62c59b}.emoji{font-size:43px}.name{font-size:20px;font-weight:750}.status{font-size:16px;color:#667085}.done .status{color:#167447}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.primary{padding:12px 16px;border-radius:12px;border:1px solid #cad3d8;background:white;font-size:15px;color:#344054}.success{text-align:center;background:#dcf7e7;border-radius:20px;padding:20px;font-size:23px;font-weight:700}.settings{margin-top:32px;background:#fff;border-radius:20px;padding:20px}.settings summary{font-weight:700;cursor:pointer}.settings label{display:block;margin:15px 0 6px;font-weight:700}.settings input,.settings select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.settings .line{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:10px 0}.entry span{flex:1}.entry button{border:0;background:#fff0ee;color:#9a342e;border-radius:8px;padding:8px}.note{font-size:13px;color:#667085;line-height:1.6}button{touch-action:manipulation}button:focus-visible{outline:3px solid #2277bd}@media(min-width:600px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:380px){.name{font-size:17px}.item{min-height:140px}}
</style></head><body><main><header><h1>🌈 わすれもの チェック</h1><p>じゅんびが できたら タッチしてね！</p></header><nav class="days" id="days" aria-label="ようび"></nav><div class="summary"><strong id="heading"></strong><span id="count"></span></div><div class="progress"><div id="bar"></div></div><div class="items" id="items"></div><div id="congrats" aria-live="polite"></div><div class="actions"><button id="reset">↻ きょうのチェックを やりなおす</button><button id="today">📅 きょうに もどす</button></div><details class="settings"><summary>⚙️ おうちのひと：もちものを へんしゅう</summary><p class="note">持ち物はこのiPadのブラウザに保存されます。ほかの端末には自動同期されません。</p><div id="entries"></div><form id="add"><label for="itemname">もちものの なまえ</label><input id="itemname" maxlength="30" placeholder="れい：きゅうしょくぶくろ" required><div class="line"><div><label for="itememoji">えもじ</label><input id="itememoji" maxlength="8" value="🎒"></div><div><label for="itemdays">もっていくひ</label><select id="itemdays"><option value="all">まいにち</option><option value="1">月ようび</option><option value="2">火ようび</option><option value="3">水ようび</option><option value="4">木ようび</option><option value="5">金ようび</option></select></div></div><p><button class="primary" type="submit">＋ もちものを ついか</button></p></form><button id="restore" class="primary" type="button">さいしょのリストに もどす</button><p class="note">※ 元に戻すと編集した持ち物は消えます。チェック状態は日付ごとに保存し、翌日は新しい状態から始まります。週末は次の月曜日を表示します。</p></details></main><script>
const KEY='school-list-v1', CK='school-check-v1';const initial=[{id:'handkerchief',name:'ハンカチ',emoji:'🧻',day:'all'},{id:'tissue',name:'ティッシュ',emoji:'🧸',day:'all'},{id:'bottle',name:'すいとう',emoji:'💧',day:'all'},{id:'notebook',name:'れんらくちょう',emoji:'📒',day:'all'},{id:'pencil',name:'ふでばこ',emoji:'✏️',day:'all'},{id:'shoes',name:'うわばき',emoji:'👟',day:'1'},{id:'gym',name:'たいそうぎ',emoji:'👕',day:'1'}];const names=['','月','火','水','木','金'];const safeRead=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};let list=safeRead(KEY,initial),checks=safeRead(CK,{});const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let selected=new Date().getDay();if(selected===0||selected===6)selected=1;let currentDate=dateKey();function persist(){localStorage.setItem(KEY,JSON.stringify(list));localStorage.setItem(CK,JSON.stringify(checks))}function currentItems(){return list.filter(x=>x.day==='all'||Number(x.day)===selected)}function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){const now=dateKey();if(now!==currentDate){currentDate=now;selected=new Date().getDay();if(selected===0||selected===6)selected=1}const days=document.getElementById('days');days.replaceChildren();for(let i=1;i<=5;i++){const b=el('button',selected===i?'active':'',names[i]);b.type='button';b.setAttribute('aria-pressed',String(selected===i));b.onclick=()=>{selected=i;render()};days.append(b)}document.getElementById('heading').textContent=names[selected]+'ようびの もちもの';const arr=currentItems(),count=arr.filter(x=>checks[`${currentDate}|${selected}|${x.id}`]).length;document.getElementById('count').textContent=`${count} / ${arr.length} できた！`;document.getElementById('bar').style.width=(arr.length?100*count/arr.length:0)+'%';const wrap=document.getElementById('items');wrap.replaceChildren();arr.forEach(x=>{const key=`${currentDate}|${selected}|${x.id}`,isDone=!!checks[key];const b=el('button','item'+(isDone?' done':''));b.type='button';b.setAttribute('aria-pressed',String(isDone));b.append(el('span','emoji',x.emoji),el('span','name',x.name),el('span','status',isDone?'✅ できた！':'◯ まだだよ'));b.onclick=()=>{checks[key]=!checks[key];persist();render()};wrap.append(b)});const win=document.getElementById('congrats');win.replaceChildren();if(arr.length&&count===arr.length)win.append(el('div','success','🎉 ぜんぶ できた！ いってらっしゃい！'));renderEntries()}function renderEntries(){const wrap=document.getElementById('entries');wrap.replaceChildren();list.forEach(x=>{const row=el('div','entry');row.append(el('span','',`${x.emoji} ${x.name}（${x.day==='all'?'まいにち':names[Number(x.day)]+'ようび'}）`));const b=el('button','','けす');b.type='button';b.onclick=()=>{if(confirm(`${x.name} を けしますか？`)){list=list.filter(y=>y.id!==x.id);persist();render()}};row.append(b);wrap.append(row)})}document.getElementById('add').onsubmit=e=>{e.preventDefault();const name=document.getElementById('itemname').value.trim();if(!name)return;list.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,emoji:document.getElementById('itememoji').value.trim()||'🎒',day:document.getElementById('itemdays').value});document.getElementById('itemname').value='';persist();render()};document.getElementById('reset').onclick=()=>{if(!confirm('このようびのチェックを やりなおしますか？'))return;currentItems().forEach(x=>delete checks[`${currentDate}|${selected}|${x.id}`]);persist();render()};document.getElementById('today').onclick=()=>{selected=new Date().getDay();if(selected===0||selected===6)selected=1;render()};document.getElementById('restore').onclick=()=>{if(confirm('もちものリストを さいしょのじょうたいに もどしますか？')){list=structuredClone(initial);persist();render()}};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script></body></html>
